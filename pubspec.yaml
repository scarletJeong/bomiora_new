name: bomiora_app
description: 보미오라 다이어트 쇼핑몰 Flutter 앱

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI 관련
  # carousel_slider: ^4.2.1  # Flutter와 충돌로 주석 처리
  
  # 네트워킹
  http: ^1.1.0
  
  # 암호화
  crypto: ^3.0.3
  
  # 유틸리티
  intl: ^0.20.2
  
  # 국제화 지원
  flutter_localizations:
    sdk: flutter
  
  # 상태관리 (필요시)
  # provider: ^6.1.1  # 현재 사용하지 않음
  
  # 로컬 저장소
  shared_preferences: ^2.2.2
  
  # 로컬 데이터베이스
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path: ^1.8.3  # 현재 사용하지 않음
  
  # 이미지 캐싱
  # cached_network_image: ^3.3.0  # 현재 사용하지 않음
  
  # WebView (결제 페이지용) - 웹에서는 사용 불가
  # webview_flutter: ^4.4.2
  
  # 웹용 URL 런처
  url_launcher: ^6.2.1
  
  # 이미지 선택
  image_picker: ^1.0.4
  file_picker: ^8.1.2
  
  # HTML 렌더링
  flutter_html: ^3.0.0-beta.2
  
  # 인앱 웹뷰
  flutter_inappwebview: ^6.0.0
  
  # 차트
  fl_chart: ^0.68.0
  kakao_flutter_sdk: ^1.10.0
  flutter_naver_login: ^2.1.1
  
  # SVG 이미지 지원
  flutter_svg: ^2.0.9
  share_plus: ^12.0.2
  
  # Firebase (모바일 FCM — 웹은 fcm_service_stub 사용)
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1
  health: ^13.3.1
  permission_handler: ^12.0.3
  
  # URL 런처
  # url_launcher: ^6.2.1  # 현재 사용하지 않음

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/img/
    # 웹 빌드 AssetManifest 누락 방지(폴더 등록만으로 생략되는 경우 대비)
    - assets/img/product_main_intro.png
    - assets/img/product_main_1.jpg
    - assets/img/product_main_bottom_1.png
    - assets/img/product_main_bottom_2.png
    - assets/img/product_main_bottom_3.png
    - assets/img/product_main_bottom_4.png
    - assets/img/product_main_icon1.svg
    - assets/img/product_main_icon2.svg
    - assets/img/product_main_icon3.svg
    - assets/img/pay_credit.svg
    - assets/img/pay_cash.svg
    - assets/img/escrow.png

  # 한국어 로케일 지원
  generate: true

  fonts:
    - family: Gmarket Sans TTF
      fonts:
        - asset: assets/font/GmarketSansTTFLight.ttf
          weight: 300
        - asset: assets/font/GmarketSansTTFMedium.ttf
          weight: 500
        - asset: assets/font/GmarketSansTTFBold.ttf
          weight: 700
